auth_enabled: false

server:
    http_listen_port: 3100

limits_config:
    allow_structured_metadata: false

common:
    path_prefix: /tmp/loki
    storage:
        filesystem:
            chunks_directory: /tmp/loki/chunks
            rules_directory: /tmp/loki/rules
    replication_factor: 1
    ring:
        kvstore:
            store: inmemory

schema_config:
    configs:
        - from: 2023-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v12
          index:
              prefix: index_
              period: 24h
