# The empiriq stack: the database and all services, on one network.
#   make up      start everything
#   make help    list all targets
#
# The services are built from the repositories next to this one
# (../empiriq, ../binance-backfiller, ../binance-feeder, ../console). Override the paths in .env.
#
# The project name "empiriq" keeps the names of the network
# (empiriq_default) and of the database volume (empiriq_pgdata).
name: empiriq

x-db-env: &db-env
  PGHOST: empiriq
  PGUSER: ${EMPIRIQ_DB_ADMIN_USER:-empiriq}
  PGPASSWORD: ${EMPIRIQ_DB_ADMIN_PASSWORD:-empiriq}
  PGDATABASE: ${EMPIRIQ_DB_NAME:-empiriq}

services:
  # The empiriq database. The migrations run when the volume is empty.
  empiriq:
    image: postgres:18
    environment:
      POSTGRES_USER: ${EMPIRIQ_DB_ADMIN_USER:-empiriq}
      POSTGRES_PASSWORD: ${EMPIRIQ_DB_ADMIN_PASSWORD:-empiriq}
      POSTGRES_DB: ${EMPIRIQ_DB_NAME:-empiriq}
    ports:
      - "${EMPIRIQ_PG_PORT:-1792}:5432"
    volumes:
      - ${EMPIRIQ_DIR:-../empiriq}/migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Creates or updates the database logins of the services, then exits.
  # It runs on every "up", so the logins also come back after a reset.
  logins:
    image: postgres:18
    depends_on:
      empiriq:
        condition: service_healthy
    environment:
      <<: *db-env
      CONSOLE_DB_USER: ${CONSOLE_DB_USER:-empiriq_console}
      CONSOLE_DB_PASSWORD: ${CONSOLE_DB_PASSWORD:-console}
      BACKFILLER_DB_USER: ${BACKFILLER_DB_USER:-empiriq_backfiller}
      BACKFILLER_DB_PASSWORD: ${BACKFILLER_DB_PASSWORD:-backfiller}
      FEEDER_DB_USER: ${FEEDER_DB_USER:-empiriq_binance_feeder}
      FEEDER_DB_PASSWORD: ${FEEDER_DB_PASSWORD:-feeder}
    volumes:
      - ./sql:/sql:ro
    entrypoint:
      - sh
      - -c
      - >-
        psql -X -q -v ON_ERROR_STOP=1
        -v console_user="$$CONSOLE_DB_USER" -v console_password="$$CONSOLE_DB_PASSWORD"
        -v backfiller_user="$$BACKFILLER_DB_USER" -v backfiller_password="$$BACKFILLER_DB_PASSWORD"
        -v feeder_user="$$FEEDER_DB_USER" -v feeder_password="$$FEEDER_DB_PASSWORD"
        -f /sql/logins.sql
    restart: "no"

  binance-backfiller:
    build: ${BINANCE_BACKFILLER_DIR:-../binance-backfiller}
    depends_on:
      logins:
        condition: service_completed_successfully
    environment:
      BACKFILLER_DATABASE_URL: postgres://${BACKFILLER_DB_USER:-empiriq_backfiller}:${BACKFILLER_DB_PASSWORD:-backfiller}@empiriq:5432/${EMPIRIQ_DB_NAME:-empiriq}
      BACKFILLER_NAME: binance-backfiller
      BACKFILLER_VENUES: binance-spot=spot,binance-futures-um=futures/um
      BACKFILLER_WORKERS: "2"
    restart: unless-stopped

  binance-feeder:
    build: ${BINANCE_FEEDER_DIR:-../binance-feeder}
    depends_on:
      logins:
        condition: service_completed_successfully
    environment:
      FEEDER_DATABASE_URL: postgres://${FEEDER_DB_USER:-empiriq_binance_feeder}:${FEEDER_DB_PASSWORD:-feeder}@empiriq:5432/${EMPIRIQ_DB_NAME:-empiriq}
      FEEDER_NAME: binance-feeder
      FEEDER_VENUES: binance-spot=wss://stream.binance.com:9443/ws,binance-futures-um=wss://fstream.binance.com/ws
    restart: unless-stopped

  console:
    build: ${CONSOLE_DIR:-../console}
    depends_on:
      logins:
        condition: service_completed_successfully
    ports:
      - "${CONSOLE_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${CONSOLE_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${CONSOLE_ADMIN_PASSWORD:-admin}
      EMPIRIQ_DB_HOST: empiriq
      EMPIRIQ_DB_PORT: "5432"
      EMPIRIQ_DB_NAME: ${EMPIRIQ_DB_NAME:-empiriq}
      EMPIRIQ_DB_USER: ${CONSOLE_DB_USER:-empiriq_console}
      EMPIRIQ_DB_PASSWORD: ${CONSOLE_DB_PASSWORD:-console}
    volumes:
      # For development: dashboards and provisioning come from the console
      # repository, so changes need no rebuild. The image has its own copy.
      - ${CONSOLE_DIR:-../console}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${CONSOLE_DIR:-../console}/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    restart: unless-stopped

volumes:
  pgdata:
  grafana:
