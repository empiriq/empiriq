# The empiriq stack: the database and all services, on one network.
#   make build   build the images (docker-bake.hcl)
#   make up      start everything
#   make help    list all targets
#
# Every service runs from its image. Nothing of the repositories is mounted:
# after a change, build the image again. The versions come from versions.env.
#
# The project name "empiriq" keeps the names of the network
# (empiriq_default) and of the database volume (empiriq_pgdata).
name: empiriq

# All services log in as the owner of the database (POSTGRES_USER). Feeders
# and backfillers switch to their empiriq role at connect
# (options=-c role=empiriq_feeder), so that the stack checks the grants of
# api. Logins for each service are a matter of the installation, not of
# this repository: see the README.
x-image: &local-image
  # Without a registry the images exist only locally: never pull them.
  pull_policy: ${PULL_POLICY:-never}

services:
  # The empiriq database. The migrations in the image run when the volume is empty.
  empiriq:
    image: ${REGISTRY:-}empiriq/empiriq:${EMPIRIQ_VERSION:-dev}
    <<: *local-image
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-empiriq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-empiriq}
      POSTGRES_DB: ${POSTGRES_DB:-empiriq}
    ports:
      - "${EMPIRIQ_PG_PORT:-1792}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  binance-backfiller:
    image: ${REGISTRY:-}empiriq/binance-backfiller:${BINANCE_BACKFILLER_VERSION:-dev}
    <<: *local-image
    depends_on:
      empiriq:
        condition: service_healthy
    environment:
      BACKFILLER_DATABASE_URL: postgres://${POSTGRES_USER:-empiriq}:${POSTGRES_PASSWORD:-empiriq}@empiriq:5432/${POSTGRES_DB:-empiriq}?options=-c%20role%3Dempiriq_feeder
      BACKFILLER_NAME: binance-backfiller
      BACKFILLER_VENUES: binance-spot=spot,binance-futures-um=futures/um
      BACKFILLER_WORKERS: "2"
    restart: unless-stopped

  binance-feeder:
    image: ${REGISTRY:-}empiriq/binance-feeder:${BINANCE_FEEDER_VERSION:-dev}
    <<: *local-image
    depends_on:
      empiriq:
        condition: service_healthy
    environment:
      FEEDER_DATABASE_URL: postgres://${POSTGRES_USER:-empiriq}:${POSTGRES_PASSWORD:-empiriq}@empiriq:5432/${POSTGRES_DB:-empiriq}?options=-c%20role%3Dempiriq_feeder
      FEEDER_NAME: binance-feeder
      FEEDER_VENUES: binance-spot=spot,binance-futures-um=futures/um
    restart: unless-stopped

  console:
    image: ${REGISTRY:-}empiriq/console:${CONSOLE_VERSION:-dev}
    <<: *local-image
    depends_on:
      empiriq:
        condition: service_healthy
    ports:
      # Only this computer: the console has no login (anonymous Admin).
      - "127.0.0.1:${CONSOLE_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${CONSOLE_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${CONSOLE_ADMIN_PASSWORD:-admin}
      EMPIRIQ_DB_HOST: empiriq
      EMPIRIQ_DB_PORT: "5432"
      # Grafana cannot set a role at connect, so the console uses the owner.
      EMPIRIQ_DB_NAME: ${POSTGRES_DB:-empiriq}
      EMPIRIQ_DB_USER: ${POSTGRES_USER:-empiriq}
      EMPIRIQ_DB_PASSWORD: ${POSTGRES_PASSWORD:-empiriq}
      LOKI_URL: http://loki:3100
    volumes:
      - grafana:/var/lib/grafana
    restart: unless-stopped

  # Logs: Alloy reads the output of all containers and sends it to Loki. The
  # console shows it on the page Logs. If Loki is down, the services do not
  # notice: they write to the default json-file log driver as before.
  loki:
    image: grafana/loki:3.6.0
    # The new volume belongs to root, and the image runs as user 10001.
    user: "0"
    command: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-168h}
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345",
              "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    depends_on: [loki]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy:/var/lib/alloy/data
    restart: unless-stopped

volumes:
  pgdata:
  grafana:
  loki:
  alloy:
