# The empiriq stack: the database and all services, on one network.
#   make build   build the images (docker-bake.hcl)
#   make up      start everything
#   make help    list all targets
#
name: empiriq

# The containers take their environment from the files in env/ (see
# docs/reference/stack.md), and from env/<service>.local.env if it exists. Values come
# from .env. All services log in as the owner of the database. Feeders and
# backfillers switch to their empiriq role at connect, so that the stack
# checks the grants of api. Logins for each service are a matter of the
# installation, not of this repository: see the README.
x-image: &local-image
  # Without a registry the images exist only locally: never pull them.
  pull_policy: ${IMAGE_PULL_POLICY}

services:
  # The empiriq database. The migrations in the image run when the volume is empty.
  database:
    container_name: empiriq-database
    image: ${IMAGE_REGISTRY}empiriq/database:dev
    <<: *local-image
    env_file:
      - env/database.env
      - path: env/database.local.env
        required: false
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  binance-backfiller:
    container_name: empiriq-binance-backfiller
    image: ${IMAGE_REGISTRY}empiriq/binance-backfiller:dev
    <<: *local-image
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - env/database-client.env
      - env/binance-backfiller.env
      - path: env/binance-backfiller.local.env
        required: false
    restart: unless-stopped

  binance-feeder:
    container_name: empiriq-binance-feeder
    image: ${IMAGE_REGISTRY}empiriq/binance-feeder:dev
    <<: *local-image
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - env/database-client.env
      - env/binance-feeder.env
      - path: env/binance-feeder.local.env
        required: false
    restart: unless-stopped

  board:
    container_name: empiriq-board
    image: ${IMAGE_REGISTRY}empiriq/board:dev
    <<: *local-image
    depends_on:
      database:
        condition: service_healthy
    ports:
      # Only this computer: the board has no login (anonymous Admin).
      - "127.0.0.1:${BOARD_PORT}:3000"
    # Grafana cannot set a role at connect, so the board uses the owner.
    env_file:
      - env/database-client.env
      - env/board.env
      - path: env/board.local.env
        required: false
    volumes:
      - board_data:/var/lib/grafana
    restart: unless-stopped

  # Logs: the log agent (Alloy) reads the output of all containers and sends
  # it to the log store (Loki). The board shows it on the page Logs. If the
  # log store is down, the services do not notice: they write to the default
  # json-file log driver as before.
  log-store:
    container_name: empiriq-log-store
    image: grafana/loki:3.6.0
    # The new volume belongs to root, and the image runs as user 10001.
    user: "0"
    command: ["-config.file=/etc/loki/log-store.yaml", "-config.expand-env=true"]
    env_file:
      - env/log-store.env
      - path: env/log-store.local.env
        required: false
    volumes:
      - ./etc/log-store.yaml:/etc/loki/log-store.yaml:ro
      - log_store_data:/loki
    restart: unless-stopped

  log-agent:
    container_name: empiriq-log-agent
    image: grafana/alloy:v1.20.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345",
              "--storage.path=/var/lib/alloy/data", "/etc/alloy/log-agent.alloy"]
    depends_on: [log-store]
    env_file:
      - path: env/log-agent.local.env
        required: false
    volumes:
      - ./etc/log-agent.alloy:/etc/alloy/log-agent.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - log_agent_data:/var/lib/alloy/data
    restart: unless-stopped

volumes:
  database_data:
  board_data:
  log_store_data:
  log_agent_data:
