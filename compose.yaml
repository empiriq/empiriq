services:
    php-cli:
        build: demo/etc/php-cli
        container_name: php-cli
        command: php /app/demo/bin/run trade
        volumes:
            - .:/app
        depends_on:
            - loki
            - prometheus
    loki:
        image: grafana/loki:3.4.6
        container_name: loki
        command: -config.file=/etc/loki/config.yml
        volumes:
            - ./demo/etc/loki/config.yml:/etc/loki/config.yml
        ports:
            - 3100:3100
    promtail:
        image: grafana/promtail:3.6.4
        container_name: promtail
        volumes:
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock
            - ./demo/etc/promtail/config.yaml:/etc/promtail/config.yaml
        command: -config.file=/etc/promtail/config.yaml
        depends_on:
            - loki
    grafana:
        image: grafana/grafana:12.4.0-20977568970-ubuntu
        container_name: grafana
        ports:
            - 3000:3000
        volumes:
            - ./demo/etc/grafana/provisioning:/etc/grafana/provisioning
        depends_on:
            - loki
            - prometheus
        environment:
            - GF_SECURITY_ADMIN_USER=user346246
            - GF_SECURITY_ADMIN_PASSWORD=user346246
    prometheus:
        image: prom/prometheus:v3.0.0-beta.0
        container_name: prometheus
        ports:
            - 9090:9090
        volumes:
            - ./demo/etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    pushgateway:
        image: prom/pushgateway:v1.9.0
        container_name: pushgateway
        ports:
            - 9091:9091