# The empiriq stack: the database and all services, on one network.
#   make build   build the images (docker-bake.hcl)
#   make up      start everything
#   make help    list all targets
#
name: empiriq

# All services log in as the owner of the database (POSTGRES_USER). Feeders
# and backfillers switch to their empiriq role at connect
# (options=-c role=empiriq_feeder), so that the stack checks the grants of
# api. Logins for each service are a matter of the installation, not of
# this repository: see the README.
x-image: &local-image
  # Without a registry the images exist only locally: never pull them.
  pull_policy: ${PULL_POLICY:-never}

services:
  # The empiriq database. The migrations in the image run when the volume is empty.
  database:
    container_name: empiriq-database
    image: ${REGISTRY:-}empiriq/database:${DATABASE_VERSION:-dev}
    <<: *local-image
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-empiriq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-empiriq}
      POSTGRES_DB: ${POSTGRES_DB:-empiriq}
    ports:
      - "${DATABASE_PORT:-1792}:5432"
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  binance-backfiller:
    container_name: empiriq-binance-backfiller
    image: ${REGISTRY:-}empiriq/binance-backfiller:${BINANCE_BACKFILLER_VERSION:-dev}
    <<: *local-image
    depends_on:
      database:
        condition: service_healthy
    environment:
      BACKFILLER_DATABASE_URL: postgres://${POSTGRES_USER:-empiriq}:${POSTGRES_PASSWORD:-empiriq}@database:5432/${POSTGRES_DB:-empiriq}?options=-c%20role%3Dempiriq_feeder
      BACKFILLER_VENUES: binance-spot=spot,binance-futures-um=futures/um
      BACKFILLER_WORKERS: "2"
    restart: unless-stopped

  binance-feeder:
    container_name: empiriq-binance-feeder
    image: ${REGISTRY:-}empiriq/binance-feeder:${BINANCE_FEEDER_VERSION:-dev}
    <<: *local-image
    depends_on:
      database:
        condition: service_healthy
    environment:
      FEEDER_DATABASE_URL: postgres://${POSTGRES_USER:-empiriq}:${POSTGRES_PASSWORD:-empiriq}@database:5432/${POSTGRES_DB:-empiriq}?options=-c%20role%3Dempiriq_feeder
      FEEDER_VENUES: binance-spot=spot,binance-futures-um=futures/um
    restart: unless-stopped

  board:
    container_name: empiriq-board
    image: ${REGISTRY:-}empiriq/board:${BOARD_VERSION:-dev}
    <<: *local-image
    depends_on:
      database:
        condition: service_healthy
    ports:
      # Only this computer: the board has no login (anonymous Admin).
      - "127.0.0.1:${BOARD_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${BOARD_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${BOARD_ADMIN_PASSWORD:-admin}
      EMPIRIQ_DATABASE_HOST: database
      EMPIRIQ_DATABASE_PORT: "5432"
      # Grafana cannot set a role at connect, so the board uses the owner.
      EMPIRIQ_DATABASE_NAME: ${POSTGRES_DB:-empiriq}
      EMPIRIQ_DATABASE_USER: ${POSTGRES_USER:-empiriq}
      EMPIRIQ_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-empiriq}
      EMPIRIQ_LOG_STORE_URL: http://log-store:3100
    volumes:
      - board_data:/var/lib/grafana
    restart: unless-stopped

  # Logs: the log agent (Alloy) reads the output of all containers and sends
  # it to the log store (Loki). The board shows it on the page Logs. If the
  # log store is down, the services do not notice: they write to the default
  # json-file log driver as before.
  log-store:
    container_name: empiriq-log-store
    image: grafana/loki:3.6.0
    # The new volume belongs to root, and the image runs as user 10001.
    user: "0"
    command: ["-config.file=/etc/loki/log-store.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-168h}
    volumes:
      - ./etc/log-store.yaml:/etc/loki/log-store.yaml:ro
      - log_store_data:/loki
    restart: unless-stopped

  log-agent:
    container_name: empiriq-log-agent
    image: grafana/alloy:v1.20.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345",
              "--storage.path=/var/lib/alloy/data", "/etc/alloy/log-agent.alloy"]
    depends_on: [log-store]
    volumes:
      - ./etc/log-agent.alloy:/etc/alloy/log-agent.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - log_agent_data:/var/lib/alloy/data
    restart: unless-stopped

volumes:
  database_data:
  board_data:
  log_store_data:
  log_agent_data:
